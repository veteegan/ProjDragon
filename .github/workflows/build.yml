name: Build ProjDragon Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Select Xcode 16
      run: |
        sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Build Dylib via xcodebuild
      run: |
        xcodebuild \
          -project Dragon.xcodeproj \
          -scheme Sishen \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR=build/Release-iphoneos

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sishen-Dylib
        path: |
          build/Release-iphoneos/*.dylib
